services:
  data-ingestion-module:
    build:
      context: .
      dockerfile: Dockerfile
    image: data-ingestion-module:local
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      MONGO_URI: ${MONGO_URI:-mongodb://terra-mongodb:27017/terra_db}
      S3_ENDPOINT: ${S3_ENDPOINT:-terra-minio}
      S3_PORT: ${S3_PORT:-9000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port=process.env.PORT||3000; fetch('http://127.0.0.1:'+port+'/api/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - terra-network

networks:
  terra-network:
    name: terra-network
    external: true
