[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-ingestion-module"
version = "0.1.0"
description = "Minimal FastAPI foundation for the TERRA data ingestion module"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "terra-data-collection @ git+https://github.com/terra-horizon/uc1.forecaster.uth.alpha.git@4c9c7ef60d823f8b794d054978c4b2db3e54baa8#subdirectory=collector",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["app.packages*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
